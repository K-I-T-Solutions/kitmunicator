; ============================================================
; KITmunicator – Dialplan
;
; Kontexte:
;   internal          – registrierte interne User (10xx)
;   from_trunk        – eingehende Anrufe vom Sipgate-Trunk
;   outbound          – ausgehende Anrufe via Sipgate
; ============================================================

[globals]
; Voicemail-Kontext
VOICEMAIL_CONTEXT = internal_vm
; Klingelzeit vor Voicemail (Sekunden)
RING_TIMEOUT = 30
; Sipgate Vorwahl / Rufnummer-Prefix
SIPGATE_OUTBOUND_PREFIX =
; Backend-URL für FCM-Push-Webhook (intern)
BACKEND_URL = http://kitmunicator_backend:8000
; Eigene Ansagen aus der Web-App (<durchwahl>.wav16, read-only eingehängt)
GREETINGS_DIR = /var/lib/kitmunicator/greetings

; ── Hints (Voraussetzung für DeviceStateChanged via ARI) ─────────────────────
; Wildcard-Pattern — deckt alle 10xx Durchwahlen dynamisch ab.

[internal_hints]
exten => _10XX,hint,PJSIP/\${EXTEN:0}

; ── Interner Kontext ──────────────────────────────────────────────────────────

[internal]
include => internal_hints

; Interne Durchwahlen 10xx
; Backend liefert "username|status|push". Wer nicht klingeln kann, landet sofort
; auf der Ansage „… ist zurzeit nicht erreichbar“ + Mailbox statt in Stille:
;   - „Nicht stören“         → nicht klingeln
;   - nicht registriert      → ohne App sofort, mit App erst FCM-Push (max. 15 s)
;   - klingelt ohne Annahme  → Mailbox, besetzt → Besetzt-Ansage
exten => _10XX,1,NoOp(Interner Anruf: ${CALLERID(num)} → ${EXTEN})
 same => n,Set(CURLOPT(httpheader)=Accept: text/plain)
 same => n,Set(CALLEE=${CURL(${BACKEND_URL}/telephony/internal/callee/${EXTEN})})
 same => n,Set(SIP_USER=${CUT(CALLEE,|,1)})
 same => n,Set(CALLEE_STATUS=${CUT(CALLEE,|,2)})
 same => n,Set(CALLEE_PUSH=${CUT(CALLEE,|,3)})
 same => n,GotoIf($["${SIP_USER}" = ""]?voicemail)
 same => n,GotoIf($["${CALLEE_STATUS}" = "dnd"]?voicemail)
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${SIP_USER})}" != ""]?dial)
 same => n,GotoIf($["${CALLEE_PUSH}" != "1"]?voicemail)
 same => n,NoOp(${SIP_USER} nicht registriert — FCM-Push senden)
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/json)
 same => n,Set(FCM_BODY={"caller_id":"${CALLERID(num)}","caller_name":"${CALLERID(name)}","callee_extension":"${EXTEN}","uuid":"${UNIQUEID}"})
 same => n,Set(FCM_RESULT=${CURL(${BACKEND_URL}/telephony/webhook/incoming-call,${FCM_BODY})})
 same => n,Set(PUSH_WAITED=0)
 same => n(wait_register),GotoIf($[${PUSH_WAITED} >= 15]?voicemail)
 same => n,Wait(3)
 same => n,Set(PUSH_WAITED=$[${PUSH_WAITED}+3])
 same => n,GotoIf($["${PJSIP_DIAL_CONTACTS(${SIP_USER})}" = ""]?wait_register)
 same => n(dial),Dial(PJSIP/${SIP_USER},${RING_TIMEOUT},tTkK)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n,GotoIf($["${DIALSTATUS}" = "BUSY"]?busy)
 same => n,Goto(voicemail)

; Das Backend liest die Nachrichten direkt aus dem Spool-Volume
exten => _10XX,n(voicemail),GotoIf(${STAT(e,${GREETINGS_DIR}/${EXTEN}.wav16)}?custom_greeting)
exten => _10XX,n,VoiceMail(${EXTEN}@${VOICEMAIL_CONTEXT},u)
exten => _10XX,n(done),Hangup()

exten => _10XX,n(busy),GotoIf(${STAT(e,${GREETINGS_DIR}/${EXTEN}.wav16)}?custom_greeting)
exten => _10XX,n,VoiceMail(${EXTEN}@${VOICEMAIL_CONTEXT},b)
exten => _10XX,n,Hangup()

; Eigene Ansage statt "Der Teilnehmer … ist nicht erreichbar", danach direkt Piepton (s)
exten => _10XX,n(custom_greeting),Answer()
exten => _10XX,n,Playback(${GREETINGS_DIR}/${EXTEN})
exten => _10XX,n,VoiceMail(${EXTEN}@${VOICEMAIL_CONTEXT},s)
exten => _10XX,n,Hangup()

; Sammelrufgruppen 20xx: alle aktiven Mitglieder klingeln gleichzeitig.
; Das Backend liefert "timeout|PJSIP/a&PJSIP/b|fallback" (Verwaltung → Gruppen).
exten => _20XX,1,NoOp(Gruppe ${EXTEN}: ${CALLERID(num)})
 same => n,Set(CURLOPT(httpheader)=Accept: text/plain)
 same => n,Set(GROUP_INFO=${CURL(${BACKEND_URL}/telephony/internal/group/${EXTEN})})
 same => n,GotoIf($["${GROUP_INFO}" = ""]?nogroup)
 same => n,Set(GROUP_TIMEOUT=${CUT(GROUP_INFO,|,1)})
 same => n,Set(GROUP_DIAL=${CUT(GROUP_INFO,|,2)})
 same => n,Set(GROUP_FALLBACK=${CUT(GROUP_INFO,|,3)})
 same => n,GotoIf($["${GROUP_DIAL}" = ""]?fallback)
 same => n,Dial(${GROUP_DIAL},${GROUP_TIMEOUT},tTkK)
 same => n,GotoIf($["${DIALSTATUS}" = "ANSWER"]?done)
 same => n(fallback),GotoIf($["${GROUP_FALLBACK}" = ""]?done)
 same => n,Goto(internal,${GROUP_FALLBACK},1)
 same => n(nogroup),Congestion(3)
 same => n(done),Hangup()

; Voicemail abhören: *98 + eigene Durchwahl
exten => _*9810XX,1,NoOp(Voicemail abhören: ${EXTEN:3})
 same => n,VoiceMailMain(${EXTEN:3}@${VOICEMAIL_CONTEXT},s)
 same => n,Hangup()

; Weiterleitung auf externen Anschluss: 0 + Vorwahl + Nummer
exten => _0.,1,NoOp(Ausgehend: ${CALLERID(num)} → ${EXTEN:1})
 same => n,Goto(outbound,${EXTEN:1},1)

; Konferenzraum: 900x
exten => _900X,1,NoOp(Konferenzraum: ${EXTEN})
 same => n,ConfBridge(${EXTEN},default_bridge,default_user)
 same => n,Hangup()

; Echo-Test für Verbindungscheck
exten => 9999,1,Answer()
 same => n,Echo()
 same => n,Hangup()

; ── Ausgehend via Sipgate ─────────────────────────────────────────────────────

[outbound]

; Internationale Nummern (+49...) direkt
exten => _+.,1,NoOp(Ausgehend international: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@sipgate_trunk,60,tTkK)
 same => n,Hangup()

; Nationale Nummern (0xx)
exten => _0.,1,NoOp(Ausgehend national: ${EXTEN})
 same => n,Set(DIAL_NUM=${SIPGATE_OUTBOUND_PREFIX}${EXTEN})
 same => n,Dial(PJSIP/${DIAL_NUM}@sipgate_trunk,60,tTkK)
 same => n,Hangup()

; ── Eingehend vom Sipgate-Trunk ───────────────────────────────────────────────

[from_trunk]

; Eingehende Anrufe direkt auf eine Durchwahl (DID)
exten => _10XX,1,NoOp(Eingehend DID: ${EXTEN})
 same => n,Goto(internal,${EXTEN},1)

; Alles andere: Backend ordnet die Rufnummer einer Gruppe zu
; (Gruppe mit dieser Sipgate-Nummer, sonst die Gruppe "alle übrigen Anrufe")
exten => s,1,Set(DID=s)
 same => n,Goto(route,1)
exten => _X.,1,Set(DID=${EXTEN})
 same => n,Goto(route,1)
exten => _+X.,1,Set(DID=${EXTEN:1})
 same => n,Goto(route,1)
exten => route,1,NoOp(Eingehender Trunk-Anruf ${CALLERID(num)} → ${DID})
 same => n,Set(CURLOPT(httpheader)=Accept: text/plain)
 same => n,Set(INBOUND_TARGET=${CURL(${BACKEND_URL}/telephony/internal/inbound/${DID})})
 same => n,GotoIf($["${INBOUND_TARGET}" = ""]?unrouted)
 same => n,Goto(internal,${INBOUND_TARGET},1)
 same => n(unrouted),Busy(3)

; Fallback: Besetzt-Signal
exten => i,1,Busy(3)
exten => t,1,Hangup()
