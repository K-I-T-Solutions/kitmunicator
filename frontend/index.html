<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="KITmunicator – Internes Kommunikationssystem" />
    <script>
      // Theme vor dem ersten Rendern setzen (kein Aufblitzen). Standard: dunkel.
      try {
        if (localStorage.getItem('kitmunicator:theme') !== 'light') document.documentElement.classList.add('dark')
      } catch {
        document.documentElement.classList.add('dark')
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>KITmunicator</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
